<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>My PWA</title>

  <!-- PWA manifest -->
  <link rel="manifest" href="manifest.json" />

  <!-- iOS-specific meta tags -->
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="My PWA" />
  <link rel="apple-touch-icon" href="icons/icon-192.png" />

  <meta name="theme-color" content="#4f46e5" />

  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #0f0f1a;
      color: #e2e8f0;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: env(safe-area-inset-top) env(safe-area-inset-right)
               env(safe-area-inset-bottom) env(safe-area-inset-left);
      padding-inline: 1.5rem;
    }

    .card {
      background: #1e1e3a;
      border: 1px solid #2d2d5e;
      border-radius: 1.5rem;
      padding: 2rem;
      max-width: 420px;
      width: 100%;
      text-align: center;
      box-shadow: 0 8px 32px rgba(0,0,0,0.4);
    }

    .icon { font-size: 3.5rem; margin-bottom: 0.75rem; }

    h1 { font-size: 1.75rem; font-weight: 700; color: #a78bfa; margin-bottom: 0.5rem; }

    p { color: #94a3b8; font-size: 0.95rem; line-height: 1.6; margin-bottom: 1.5rem; }

    .counter-display {
      font-size: 4rem;
      font-weight: 800;
      color: #7c3aed;
      margin-bottom: 1.5rem;
      letter-spacing: -2px;
    }

    .btn-row { display: flex; gap: 0.75rem; justify-content: center; flex-wrap: wrap; }

    button {
      border: none;
      border-radius: 0.75rem;
      padding: 0.75rem 1.5rem;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: transform 0.1s, opacity 0.15s;
    }
    button:active { transform: scale(0.95); opacity: 0.85; }

    .btn-primary { background: #7c3aed; color: #fff; }
    .btn-secondary { background: #312e81; color: #c4b5fd; }
    .btn-danger { background: #7f1d1d; color: #fca5a5; }

    .status {
      margin-top: 1.5rem;
      font-size: 0.8rem;
      color: #475569;
    }
    .status span { color: #6ee7b7; }

    /* Install banner — hidden by default, shown via JS */
    #install-banner {
      display: none;
      background: #1e3a5f;
      border: 1px solid #2563eb;
      border-radius: 1rem;
      padding: 1rem 1.25rem;
      max-width: 420px;
      width: 100%;
      margin-bottom: 1rem;
      font-size: 0.85rem;
      color: #bfdbfe;
    }
    #install-banner.visible { display: flex; align-items: center; gap: 0.75rem; }
    #install-banner .banner-text { flex: 1; }
    #install-btn { padding: 0.5rem 1rem; font-size: 0.85rem; }
  </style>
</head>
<body>

  <div id="install-banner">
    <span>📲</span>
    <span class="banner-text">Add to Home Screen for the full app experience.</span>
    <button class="btn-primary" id="install-btn">Install</button>
  </div>

  <div class="card">
    <div class="icon">🚀</div>
    <h1>My PWA</h1>
    <p>A simple Progressive Web App. Works offline and can be installed on your iPhone via <strong>Share → Add to Home Screen</strong>.</p>

    <div class="counter-display" id="count">0</div>

    <div class="btn-row">
      <button class="btn-primary" onclick="change(1)">+ Add</button>
      <button class="btn-secondary" onclick="change(-1)">− Sub</button>
      <button class="btn-danger" onclick="reset()">Reset</button>
    </div>

    <div class="status">
      Service worker: <span id="sw-status">checking…</span>
    </div>
  </div>

  <script>
    // Counter with localStorage persistence
    let count = parseInt(localStorage.getItem('pwa-count') || '0', 10);
    const display = document.getElementById('count');

    function render() { display.textContent = count; }
    function change(n) { count += n; localStorage.setItem('pwa-count', count); render(); }
    function reset() { count = 0; localStorage.setItem('pwa-count', 0); render(); }
    render();

    // Register service worker
    const swStatus = document.getElementById('sw-status');
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('sw.js')
        .then(() => { swStatus.textContent = 'active ✓'; swStatus.style.color = '#6ee7b7'; })
        .catch(() => { swStatus.textContent = 'unavailable'; swStatus.style.color = '#fca5a5'; });
    } else {
      swStatus.textContent = 'not supported';
    }

    // Show install prompt on supported browsers (not iOS Safari)
    let deferredPrompt;
    window.addEventListener('beforeinstallprompt', e => {
      e.preventDefault();
      deferredPrompt = e;
      document.getElementById('install-banner').classList.add('visible');
    });
    document.getElementById('install-btn').addEventListener('click', async () => {
      if (!deferredPrompt) return;
      deferredPrompt.prompt();
      await deferredPrompt.userChoice;
      deferredPrompt = null;
      document.getElementById('install-banner').classList.remove('visible');
    });
  </script>
</body>
</html>
