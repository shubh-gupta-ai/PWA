<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>HF Daily Papers</title>

  <link rel="manifest" href="manifest.json" />

  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Papers" />
  <link rel="apple-touch-icon" href="icons/icon-192.png" />

  <meta name="theme-color" content="#0f0f1a" />

  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html, body { height: 100%; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #0f0f1a;
      color: #e2e8f0;
      min-height: 100dvh;
      padding-top: env(safe-area-inset-top);
      padding-bottom: env(safe-area-inset-bottom);
      -webkit-font-smoothing: antialiased;
    }

    header {
      position: sticky;
      top: 0;
      z-index: 10;
      background: rgba(15, 15, 26, 0.92);
      backdrop-filter: saturate(150%) blur(12px);
      -webkit-backdrop-filter: saturate(150%) blur(12px);
      border-bottom: 1px solid #1e1e3a;
      padding: 0.75rem 1rem 0.6rem;
    }

    h1 {
      font-size: 1.25rem;
      font-weight: 700;
      color: #a78bfa;
      letter-spacing: -0.01em;
    }

    #meta {
      font-size: 0.75rem;
      color: #64748b;
      margin-top: 0.15rem;
    }

    #search {
      width: 100%;
      margin-top: 0.6rem;
      padding: 0.6rem 0.85rem;
      background: #1e1e3a;
      border: 1px solid #2d2d5e;
      border-radius: 0.65rem;
      color: #e2e8f0;
      font-size: 0.95rem;
      font-family: inherit;
      -webkit-appearance: none;
      appearance: none;
    }
    #search::placeholder { color: #64748b; }
    #search:focus { outline: none; border-color: #7c3aed; }

    .controls {
      display: flex;
      gap: 0.5rem;
      margin-top: 0.5rem;
      align-items: center;
    }

    .controls select {
      flex: 1;
      min-width: 0;
      padding: 0.5rem 0.65rem;
      background: #1e1e3a;
      border: 1px solid #2d2d5e;
      border-radius: 0.55rem;
      color: #e2e8f0;
      font-size: 0.85rem;
      font-family: inherit;
      -webkit-appearance: none;
      appearance: none;
      background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 12 12'><path fill='%2394a3b8' d='M6 8.5L1.5 4h9z'/></svg>");
      background-repeat: no-repeat;
      background-position: right 0.5rem center;
      padding-right: 1.5rem;
    }

    #refresh {
      flex-shrink: 0;
      width: 2.25rem;
      height: 2.25rem;
      border: 1px solid #2d2d5e;
      background: #1e1e3a;
      color: #a78bfa;
      border-radius: 0.55rem;
      font-size: 1.1rem;
      cursor: pointer;
      display: grid;
      place-items: center;
      transition: transform 0.4s ease, opacity 0.15s;
    }
    #refresh:active { opacity: 0.7; }
    #refresh.spinning { animation: spin 0.9s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }

    main {
      padding: 0.85rem 1rem 2rem;
      max-width: 720px;
      margin: 0 auto;
    }

    #status {
      padding: 1.5rem 1rem;
      text-align: center;
      color: #64748b;
      font-size: 0.9rem;
    }
    #status .retry {
      display: inline-block;
      margin-top: 0.6rem;
      padding: 0.45rem 0.95rem;
      background: #7c3aed;
      color: #fff;
      border: none;
      border-radius: 0.5rem;
      font-size: 0.85rem;
      font-weight: 600;
      cursor: pointer;
    }

    #toast {
      position: fixed;
      bottom: calc(env(safe-area-inset-bottom) + 1rem);
      left: 50%;
      transform: translateX(-50%) translateY(120%);
      background: #7f1d1d;
      color: #fecaca;
      padding: 0.55rem 1rem;
      border-radius: 0.6rem;
      font-size: 0.85rem;
      transition: transform 0.25s ease;
      z-index: 20;
      pointer-events: none;
    }
    #toast.show { transform: translateX(-50%) translateY(0); }

    #list { list-style: none; }

    .paper {
      display: grid;
      grid-template-columns: 88px 1fr;
      gap: 0.75rem;
      padding: 0.85rem;
      border: 1px solid #2d2d5e;
      border-radius: 0.9rem;
      background: #1e1e3a;
      margin-bottom: 0.7rem;
      cursor: pointer;
      transition: border-color 0.15s;
    }
    .paper:active { border-color: #4c1d95; }
    .paper.expanded { border-color: #7c3aed; }

    .thumb {
      width: 88px;
      aspect-ratio: 4 / 3;
      object-fit: cover;
      border-radius: 0.5rem;
      background: #0f0f1a;
      display: block;
    }
    .thumb.no-img {
      display: grid;
      place-items: center;
      font-size: 1.5rem;
      color: #475569;
    }

    .paper .info { min-width: 0; }

    .title {
      font-size: 0.95rem;
      font-weight: 600;
      color: #e2e8f0;
      line-height: 1.3;
      margin-bottom: 0.25rem;
    }

    .authors {
      font-size: 0.75rem;
      color: #94a3b8;
      margin-bottom: 0.35rem;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .row {
      display: flex;
      gap: 0.75rem;
      font-size: 0.72rem;
      color: #64748b;
      margin-bottom: 0.4rem;
    }
    .upvotes { color: #6ee7b7; font-weight: 600; }

    .abstract {
      font-size: 0.82rem;
      line-height: 1.5;
      color: #cbd5e1;
    }
    .abstract.clamped {
      display: -webkit-box;
      -webkit-line-clamp: 3;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }
    .paper.expanded .abstract { -webkit-line-clamp: unset; display: block; }

    .actions {
      display: none;
      gap: 0.5rem;
      margin-top: 0.75rem;
      flex-wrap: wrap;
    }
    .paper.expanded .actions { display: flex; }

    .actions a {
      display: inline-block;
      padding: 0.5rem 0.95rem;
      border-radius: 0.5rem;
      font-size: 0.82rem;
      font-weight: 600;
      text-decoration: none;
    }
    .btn-primary { background: #7c3aed; color: #fff; }
    .btn-secondary { background: #312e81; color: #c4b5fd; }

    #install-banner {
      display: none;
      background: #1e3a5f;
      border: 1px solid #2563eb;
      border-radius: 0.75rem;
      padding: 0.7rem 0.85rem;
      margin-bottom: 0.75rem;
      font-size: 0.8rem;
      color: #bfdbfe;
      align-items: center;
      gap: 0.6rem;
    }
    #install-banner.visible { display: flex; }
    #install-banner .banner-text { flex: 1; }
    #install-btn {
      padding: 0.4rem 0.75rem;
      background: #2563eb;
      color: #fff;
      border: none;
      border-radius: 0.4rem;
      font-size: 0.78rem;
      font-weight: 600;
      cursor: pointer;
    }

    /* Share-target bottom sheet */
    #share-modal {
      position: fixed;
      inset: 0;
      z-index: 30;
      visibility: hidden;
      pointer-events: none;
    }
    #share-modal.open {
      visibility: visible;
      pointer-events: auto;
    }
    #share-backdrop {
      position: absolute;
      inset: 0;
      background: rgba(0, 0, 0, 0.65);
      opacity: 0;
      transition: opacity 0.25s ease;
    }
    #share-modal.open #share-backdrop { opacity: 1; }
    #share-sheet {
      position: absolute;
      bottom: 0; left: 0; right: 0;
      background: #131325;
      border-radius: 1.25rem 1.25rem 0 0;
      border-top: 1px solid #2d2d5e;
      padding: 1rem 1rem calc(env(safe-area-inset-bottom) + 1.25rem);
      max-height: 82vh;
      overflow-y: auto;
      transform: translateY(100%);
      transition: transform 0.3s cubic-bezier(0.32, 0.72, 0, 1);
    }
    #share-modal.open #share-sheet { transform: translateY(0); }
    .share-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 0.9rem;
    }
    .share-label {
      font-size: 0.75rem;
      font-weight: 700;
      color: #a78bfa;
      text-transform: uppercase;
      letter-spacing: 0.07em;
    }
    #share-close {
      background: none;
      border: none;
      color: #64748b;
      font-size: 1.4rem;
      cursor: pointer;
      line-height: 1;
      padding: 0.15rem 0.3rem;
    }
  </style>
</head>
<body>

<header>
  <h1>HF Daily Papers</h1>
  <div id="meta">Loading…</div>
  <input id="search" type="search" placeholder="Search title, author, abstract…" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" />
  <div class="controls">
    <select id="date" aria-label="Date"></select>
    <select id="sort" aria-label="Sort">
      <option value="top">Top</option>
      <option value="new">Newest</option>
    </select>
    <button id="refresh" type="button" aria-label="Refresh">↻</button>
  </div>
</header>

<main>
  <div id="install-banner">
    <span>📲</span>
    <span class="banner-text">Add to Home Screen for the full app experience.</span>
    <button id="install-btn" type="button">Install</button>
  </div>
  <div id="status">Loading papers…</div>
  <ul id="list"></ul>
</main>

<div id="share-modal">
  <div id="share-backdrop"></div>
  <div id="share-sheet">
    <div class="share-header">
      <span class="share-label">Shared Paper</span>
      <button id="share-close" type="button" aria-label="Close">✕</button>
    </div>
    <div id="share-content"></div>
  </div>
</div>

<div id="toast" role="status" aria-live="polite"></div>

<script>
(() => {
  const PROXY = "https://corsproxy.io/?url=";
  const API = (date) => `https://huggingface.co/api/daily_papers?date=${date}&limit=50`;

  const $ = (id) => document.getElementById(id);
  const listEl = $("list");
  const statusEl = $("status");
  const metaEl = $("meta");
  const searchEl = $("search");
  const dateEl = $("date");
  const sortEl = $("sort");
  const refreshEl = $("refresh");
  const toastEl = $("toast");

  const state = {
    papers: [],
    date: todayUTC(),
    query: "",
    sort: localStorage.getItem("papers:sort") || "top",
    fetchedAt: null,
  };

  function todayUTC() {
    return new Date().toISOString().slice(0, 10);
  }

  function offsetDate(days) {
    const d = new Date();
    d.setUTCDate(d.getUTCDate() - days);
    return d.toISOString().slice(0, 10);
  }

  function populateDateSelect() {
    const frag = document.createDocumentFragment();

    const addOpt = (value, label, disabled = false) => {
      const opt = document.createElement("option");
      opt.value = value;
      opt.textContent = label;
      if (disabled) opt.disabled = true;
      frag.appendChild(opt);
    };

    // Aggregate views first
    addOpt("all-7",  "All – 7 days");
    addOpt("all-30", "All – 30 days");
    addOpt("",       "──────────", true);

    // Individual days
    for (let i = 0; i < 7; i++) {
      const d = offsetDate(i);
      addOpt(d, i === 0 ? `Today (${shortDate(d)})` : i === 1 ? `Yesterday (${shortDate(d)})` : shortDate(d));
    }

    dateEl.appendChild(frag);

    const saved = localStorage.getItem("papers:date");
    if (saved && [...dateEl.options].some(o => o.value === saved && !o.disabled)) {
      dateEl.value = saved;
      state.date = saved;
    } else {
      dateEl.value = state.date; // today
    }
    sortEl.value = state.sort;
  }

  function shortDate(iso) {
    const d = new Date(iso + "T00:00:00Z");
    return d.toLocaleDateString(undefined, { month: "short", day: "numeric", timeZone: "UTC" });
  }

  function relativeTime(ts) {
    if (!ts) return "";
    const s = Math.floor((Date.now() - ts) / 1000);
    if (s < 60) return "just now";
    if (s < 3600) return `${Math.floor(s / 60)}m ago`;
    if (s < 86400) return `${Math.floor(s / 3600)}h ago`;
    return `${Math.floor(s / 86400)}d ago`;
  }

  function escapeHtml(s) {
    return String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  }

  function normalize(arr) {
    if (!Array.isArray(arr)) return [];
    return arr.map(entry => {
      const p = entry.paper || {};
      const id = p.id || entry.id || "";
      const authors = Array.isArray(p.authors)
        ? p.authors.map(a => (typeof a === "string" ? a : a.name)).filter(Boolean)
        : [];
      return {
        id,
        title: (entry.title || p.title || "").trim(),
        summary: (p.summary || entry.summary || "").trim().replace(/\s+/g, " "),
        authors,
        publishedAt: p.publishedAt || entry.publishedAt || "",
        upvotes: p.upvotes ?? entry.upvotes ?? 0,
        thumbnail: entry.thumbnail || p.thumbnail || (entry.media && entry.media.thumbnail) || "",
      };
    }).filter(p => p.id && p.title);
  }

  async function fetchPapers(date) {
    refreshEl.classList.add("spinning");
    try {
      if (date === "all-7" || date === "all-30") {
        await fetchMultipleDays(date === "all-7" ? 7 : 30);
        return;
      }

      const cacheKey = `papers:${date}`;
      const cached = readCache(cacheKey);
      if (cached) {
        state.papers = cached.papers;
        state.fetchedAt = cached.fetchedAt;
        render();
      } else {
        state.papers = [];
        statusEl.textContent = "Loading papers…";
        listEl.innerHTML = "";
      }

      try {
        const fresh = await fetchOnce(date);
        state.papers = fresh;
        state.fetchedAt = Date.now();
        writeCache(cacheKey, { papers: fresh, fetchedAt: state.fetchedAt });
        updateBadge(fresh);
        render();
      } catch (err) {
        console.warn("fetch failed:", err);
        if (cached) {
          showToast("Couldn't refresh — showing cached");
        } else {
          statusEl.innerHTML = `Couldn't load papers.<br><button class="retry" type="button" onclick="location.reload()">Retry</button>`;
        }
      }
    } finally {
      refreshEl.classList.remove("spinning");
    }
  }

  async function fetchMultipleDays(n) {
    const dates = Array.from({ length: n }, (_, i) => offsetDate(i));

    // Render from cache immediately if anything is available
    const initial = mergeFromCache(dates);
    if (initial.length) {
      state.papers = initial;
      state.fetchedAt = Date.now();
      render();
    } else {
      state.papers = [];
      statusEl.style.display = "block";
      statusEl.textContent = `Loading ${n} days of papers…`;
      listEl.innerHTML = "";
    }

    // Fetch uncached days in parallel batches of 5
    const uncached = dates.filter(d => !readCache(`papers:${d}`));
    for (let i = 0; i < uncached.length; i += 5) {
      await Promise.allSettled(
        uncached.slice(i, i + 5).map(async (d) => {
          try {
            const papers = await fetchOnce(d);
            writeCache(`papers:${d}`, { papers, fetchedAt: Date.now() });
          } catch {}
        })
      );
      state.papers = mergeFromCache(dates);
      state.fetchedAt = Date.now();
      render();
    }
  }

  function mergeFromCache(dates) {
    const seen = new Set();
    const out = [];
    for (const date of dates) {
      const c = readCache(`papers:${date}`);
      if (!c) continue;
      for (const p of c.papers) {
        if (!seen.has(p.id)) { seen.add(p.id); out.push(p); }
      }
    }
    return out;
  }

  async function fetchOnce(date) {
    const url = API(date);
    try {
      const r = await fetch(url, { mode: "cors" });
      if (!r.ok) throw new Error("direct " + r.status);
      return normalize(await r.json());
    } catch (e) {
      const r = await fetch(PROXY + encodeURIComponent(url));
      if (!r.ok) throw new Error("proxy " + r.status);
      return normalize(await r.json());
    }
  }

  function readCache(key) {
    try {
      const raw = localStorage.getItem(key);
      if (!raw) return null;
      const obj = JSON.parse(raw);
      if (!obj || !Array.isArray(obj.papers)) return null;
      return obj;
    } catch { return null; }
  }

  function writeCache(key, obj) {
    try { localStorage.setItem(key, JSON.stringify(obj)); } catch {}
  }

  function applyFilters() {
    const q = state.query.trim().toLowerCase();
    let list = state.papers;
    if (q) {
      list = list.filter(p => {
        const hay = (p.title + " " + p.summary + " " + p.authors.join(" ")).toLowerCase();
        return hay.includes(q);
      });
    }
    list = list.slice().sort((a, b) => {
      if (state.sort === "new") {
        return (b.publishedAt || "").localeCompare(a.publishedAt || "");
      }
      return (b.upvotes || 0) - (a.upvotes || 0);
    });
    return list;
  }

  function render() {
    const filtered = applyFilters();
    const total = state.papers.length;
    const dateLabel = state.date === "all-7"  ? "Last 7 days" :
                      state.date === "all-30" ? "Last 30 days" :
                      shortDate(state.date);
    metaEl.textContent = total
      ? `${dateLabel} · ${filtered.length}${filtered.length !== total ? "/" + total : ""} papers · refreshed ${relativeTime(state.fetchedAt)}`
      : dateLabel;

    if (!total) {
      statusEl.style.display = "block";
      statusEl.textContent = state.fetchedAt ? "No papers found." : "Loading papers…";
      listEl.innerHTML = "";
      return;
    }
    if (!filtered.length) {
      statusEl.style.display = "block";
      statusEl.textContent = "No papers match your search.";
      listEl.innerHTML = "";
      return;
    }
    statusEl.style.display = "none";

    listEl.innerHTML = filtered.map(p => {
      const authors = p.authors.length
        ? (p.authors.slice(0, 3).join(", ") + (p.authors.length > 3 ? `, +${p.authors.length - 3}` : ""))
        : "";
      const date = p.publishedAt ? shortDate(p.publishedAt.slice(0, 10)) : "";
      const thumb = p.thumbnail
        ? `<img class="thumb" loading="lazy" src="${escapeHtml(p.thumbnail)}" alt="" />`
        : `<div class="thumb no-img">📄</div>`;
      return `
        <li class="paper" data-id="${escapeHtml(p.id)}">
          ${thumb}
          <div class="info">
            <div class="title">${escapeHtml(p.title)}</div>
            ${authors ? `<div class="authors">${escapeHtml(authors)}</div>` : ""}
            <div class="row">
              <span class="upvotes">▲ ${p.upvotes}</span>
              ${date ? `<span class="date">${escapeHtml(date)}</span>` : ""}
            </div>
            <p class="abstract clamped">${escapeHtml(p.summary || "No abstract available.")}</p>
            <div class="actions">
              <a class="btn-primary" href="https://arxiv.org/pdf/${encodeURIComponent(p.id)}.pdf" target="_blank" rel="noopener">Open PDF</a>
              <a class="btn-secondary" href="https://huggingface.co/papers/${encodeURIComponent(p.id)}" target="_blank" rel="noopener">View on HF</a>
            </div>
          </div>
        </li>`;
    }).join("");
  }

  let toastTimer;
  function showToast(msg) {
    toastEl.textContent = msg;
    toastEl.classList.add("show");
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => toastEl.classList.remove("show"), 2400);
  }

  // --- Share Target ---
  async function handleShareTarget() {
    const params = new URLSearchParams(location.search);
    const raw = params.get("url") || params.get("text") || "";
    if (!raw) return;

    // Remove share params so a refresh doesn't re-trigger
    history.replaceState(null, "", location.pathname);

    // Extract arxiv ID from common URL patterns
    const match = raw.match(/(?:arxiv\.org\/(?:abs|pdf)\/|huggingface\.co\/papers\/)(\d{4}\.\d+)/i);
    if (!match) return;
    const id = match[1];

    // Fast path: search all cached days
    let paper = null;
    for (let i = 0; i < 30; i++) {
      const c = readCache(`papers:${offsetDate(i)}`);
      if (!c) continue;
      paper = c.papers.find(p => p.id === id || p.id.startsWith(id + "v"));
      if (paper) break;
    }

    // Fallback: fetch from HF single-paper API
    if (!paper) {
      try {
        const url = `https://huggingface.co/api/papers/${id}`;
        let r;
        try { r = await fetch(url, { mode: "cors" }); if (!r.ok) throw 0; }
        catch { r = await fetch(PROXY + encodeURIComponent(url)); }
        if (r && r.ok) {
          const data = await r.json();
          paper = normalize([{ paper: data, title: data.title, thumbnail: data.thumbnail }])[0];
        }
      } catch {}
    }

    // Last resort: minimal stub so the sheet still opens with action buttons
    if (!paper) paper = { id, title: id, summary: "", authors: [], upvotes: 0, thumbnail: "" };

    showSharedPaper(paper);
  }

  function showSharedPaper(p) {
    const authors = p.authors.length
      ? p.authors.slice(0, 3).join(", ") + (p.authors.length > 3 ? `, +${p.authors.length - 3}` : "")
      : "";
    const thumb = p.thumbnail
      ? `<img class="thumb" loading="lazy" src="${escapeHtml(p.thumbnail)}" alt="" />`
      : `<div class="thumb no-img">📄</div>`;

    $("share-content").innerHTML = `
      <div class="paper expanded" style="cursor:default;margin-bottom:0;border-color:#7c3aed">
        ${thumb}
        <div class="info">
          <div class="title">${escapeHtml(p.title)}</div>
          ${authors ? `<div class="authors">${escapeHtml(authors)}</div>` : ""}
          ${p.upvotes ? `<div class="row"><span class="upvotes">▲ ${p.upvotes}</span></div>` : ""}
          ${p.summary ? `<p class="abstract">${escapeHtml(p.summary)}</p>` : ""}
          <div class="actions" style="display:flex">
            <a class="btn-primary" href="https://arxiv.org/pdf/${encodeURIComponent(p.id)}.pdf" target="_blank" rel="noopener">Open PDF</a>
            <a class="btn-secondary" href="https://huggingface.co/papers/${encodeURIComponent(p.id)}" target="_blank" rel="noopener">View on HF</a>
          </div>
        </div>
      </div>`;

    $("share-modal").classList.add("open");
  }

  $("share-close").addEventListener("click", () => $("share-modal").classList.remove("open"));
  $("share-backdrop").addEventListener("click", () => $("share-modal").classList.remove("open"));

  // --- App Badging ---
  function updateBadge(freshPapers) {
    if (!("setAppBadge" in navigator) || state.date !== todayUTC()) return;
    const lastSeen = parseInt(localStorage.getItem(`badge:seen:${todayUTC()}`) || "0", 10);
    const n = Math.max(0, freshPapers.length - lastSeen);
    if (n > 0) navigator.setAppBadge(n).catch(() => {});
  }

  // Events
  searchEl.addEventListener("input", () => {
    state.query = searchEl.value;
    render();
  });

  dateEl.addEventListener("change", () => {
    state.date = dateEl.value;
    localStorage.setItem("papers:date", state.date);
    fetchPapers(state.date);
  });

  sortEl.addEventListener("change", () => {
    state.sort = sortEl.value;
    localStorage.setItem("papers:sort", state.sort);
    render();
  });

  refreshEl.addEventListener("click", () => fetchPapers(state.date));

  listEl.addEventListener("click", (e) => {
    if (e.target.closest("a, button")) return;
    const li = e.target.closest(".paper");
    if (!li) return;
    li.classList.toggle("expanded");
  });

  // Service worker
  if ("serviceWorker" in navigator) {
    navigator.serviceWorker.register("sw.js").catch(() => {});
  }

  // Install prompt (non-iOS)
  let deferredPrompt;
  window.addEventListener("beforeinstallprompt", (e) => {
    e.preventDefault();
    deferredPrompt = e;
    $("install-banner").classList.add("visible");
  });
  $("install-btn").addEventListener("click", async () => {
    if (!deferredPrompt) return;
    deferredPrompt.prompt();
    await deferredPrompt.userChoice;
    deferredPrompt = null;
    $("install-banner").classList.remove("visible");
  });

  // Boot
  populateDateSelect();
  navigator.clearAppBadge?.().catch(() => {});
  handleShareTarget();
  fetchPapers(state.date);

  // Visibility: save seen count when leaving, clear badge + maybe refresh when returning
  document.addEventListener("visibilitychange", () => {
    if (document.visibilityState === "hidden" && state.date === todayUTC() && state.papers.length) {
      localStorage.setItem(`badge:seen:${todayUTC()}`, state.papers.length);
    }
    if (document.visibilityState === "visible") {
      navigator.clearAppBadge?.().catch(() => {});
      if (state.fetchedAt && Date.now() - state.fetchedAt > 5 * 60 * 1000) {
        fetchPapers(state.date);
      }
    }
  });
})();
</script>
</body>
</html>
