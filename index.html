<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>HF Daily Papers</title>

  <link rel="manifest" href="manifest.json" />

  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Papers" />
  <link rel="apple-touch-icon" href="icons/icon-192.png" />

  <meta name="theme-color" content="#0f0f1a" />

  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html, body { height: 100%; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #0f0f1a;
      color: #e2e8f0;
      min-height: 100dvh;
      padding-top: env(safe-area-inset-top);
      padding-bottom: env(safe-area-inset-bottom);
      -webkit-font-smoothing: antialiased;
    }

    header {
      position: sticky;
      top: 0;
      z-index: 10;
      background: rgba(15, 15, 26, 0.92);
      backdrop-filter: saturate(150%) blur(12px);
      -webkit-backdrop-filter: saturate(150%) blur(12px);
      border-bottom: 1px solid #1e1e3a;
      padding: 0.75rem 1rem 0.6rem;
    }

    h1 {
      font-size: 1.25rem;
      font-weight: 700;
      color: #a78bfa;
      letter-spacing: -0.01em;
    }

    #meta {
      font-size: 0.75rem;
      color: #64748b;
      margin-top: 0.15rem;
    }

    #search {
      width: 100%;
      margin-top: 0.6rem;
      padding: 0.6rem 0.85rem;
      background: #1e1e3a;
      border: 1px solid #2d2d5e;
      border-radius: 0.65rem;
      color: #e2e8f0;
      font-size: 0.95rem;
      font-family: inherit;
      -webkit-appearance: none;
      appearance: none;
    }
    #search::placeholder { color: #64748b; }
    #search:focus { outline: none; border-color: #7c3aed; }

    .controls {
      display: flex;
      gap: 0.5rem;
      margin-top: 0.5rem;
      align-items: center;
    }

    .controls select {
      flex: 1;
      min-width: 0;
      padding: 0.5rem 0.65rem;
      background: #1e1e3a;
      border: 1px solid #2d2d5e;
      border-radius: 0.55rem;
      color: #e2e8f0;
      font-size: 0.85rem;
      font-family: inherit;
      -webkit-appearance: none;
      appearance: none;
      background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 12 12'><path fill='%2394a3b8' d='M6 8.5L1.5 4h9z'/></svg>");
      background-repeat: no-repeat;
      background-position: right 0.5rem center;
      padding-right: 1.5rem;
    }

    #refresh {
      flex-shrink: 0;
      width: 2.25rem;
      height: 2.25rem;
      border: 1px solid #2d2d5e;
      background: #1e1e3a;
      color: #a78bfa;
      border-radius: 0.55rem;
      font-size: 1.1rem;
      cursor: pointer;
      display: grid;
      place-items: center;
      transition: transform 0.4s ease, opacity 0.15s;
    }
    #refresh:active { opacity: 0.7; }
    #refresh.spinning { animation: spin 0.9s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }

    main {
      padding: 0.85rem 1rem 2rem;
      max-width: 720px;
      margin: 0 auto;
    }

    #status {
      padding: 1.5rem 1rem;
      text-align: center;
      color: #64748b;
      font-size: 0.9rem;
    }
    #status .retry {
      display: inline-block;
      margin-top: 0.6rem;
      padding: 0.45rem 0.95rem;
      background: #7c3aed;
      color: #fff;
      border: none;
      border-radius: 0.5rem;
      font-size: 0.85rem;
      font-weight: 600;
      cursor: pointer;
    }

    #toast {
      position: fixed;
      bottom: calc(env(safe-area-inset-bottom) + 1rem);
      left: 50%;
      transform: translateX(-50%) translateY(120%);
      background: #7f1d1d;
      color: #fecaca;
      padding: 0.55rem 1rem;
      border-radius: 0.6rem;
      font-size: 0.85rem;
      transition: transform 0.25s ease;
      z-index: 20;
      pointer-events: none;
    }
    #toast.show { transform: translateX(-50%) translateY(0); }

    #list { list-style: none; }

    .paper {
      display: grid;
      grid-template-columns: 88px 1fr;
      gap: 0.75rem;
      padding: 0.85rem;
      border: 1px solid #2d2d5e;
      border-radius: 0.9rem;
      background: #1e1e3a;
      margin-bottom: 0.7rem;
      cursor: pointer;
      transition: border-color 0.15s;
    }
    .paper:active { border-color: #4c1d95; }
    .paper.expanded { border-color: #7c3aed; }

    .thumb {
      width: 88px;
      aspect-ratio: 4 / 3;
      object-fit: cover;
      border-radius: 0.5rem;
      background: #0f0f1a;
      display: block;
    }
    .thumb.no-img {
      display: grid;
      place-items: center;
      font-size: 1.5rem;
      color: #475569;
    }

    .paper .info { min-width: 0; }

    .title {
      font-size: 0.95rem;
      font-weight: 600;
      color: #e2e8f0;
      line-height: 1.3;
      margin-bottom: 0.25rem;
    }

    .authors {
      font-size: 0.75rem;
      color: #94a3b8;
      margin-bottom: 0.35rem;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .row {
      display: flex;
      gap: 0.75rem;
      font-size: 0.72rem;
      color: #64748b;
      margin-bottom: 0.4rem;
    }
    .upvotes { color: #6ee7b7; font-weight: 600; }

    .abstract {
      font-size: 0.82rem;
      line-height: 1.5;
      color: #cbd5e1;
    }
    .abstract.clamped {
      display: -webkit-box;
      -webkit-line-clamp: 3;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }
    .paper.expanded .abstract { -webkit-line-clamp: unset; display: block; }

    .actions {
      display: none;
      gap: 0.5rem;
      margin-top: 0.75rem;
      flex-wrap: wrap;
    }
    .paper.expanded .actions { display: flex; }

    .actions a, .btn-share {
      display: inline-block;
      padding: 0.5rem 0.95rem;
      border-radius: 0.5rem;
      font-size: 0.82rem;
      font-weight: 600;
      text-decoration: none;
      cursor: pointer;
    }
    .btn-primary { background: #7c3aed; color: #fff; border: none; }
    .btn-secondary { background: #312e81; color: #c4b5fd; border: none; }
    .btn-share { background: #0f172a; color: #94a3b8; border: 1px solid #2d2d5e; }

    .paper.highlight { border-color: #a78bfa !important; box-shadow: 0 0 0 3px rgba(167,139,250,0.18); }

    /* Full-screen paper view */
    #paper-view {
      position: fixed;
      inset: 0;
      z-index: 20;
      background: #0f0f1a;
      transform: translateX(100%);
      transition: transform 0.32s cubic-bezier(0.32, 0.72, 0, 1);
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
    }
    #paper-view.open { transform: translateX(0); }

    #paper-nav {
      position: sticky;
      top: 0;
      display: flex;
      align-items: center;
      gap: 0.75rem;
      padding: calc(env(safe-area-inset-top) + 0.65rem) 1rem 0.65rem;
      background: rgba(15,15,26,0.92);
      backdrop-filter: saturate(150%) blur(12px);
      -webkit-backdrop-filter: saturate(150%) blur(12px);
      border-bottom: 1px solid #1e1e3a;
      z-index: 1;
    }
    #paper-back {
      background: none;
      border: none;
      color: #a78bfa;
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
      padding: 0.3rem 0;
      white-space: nowrap;
      flex-shrink: 0;
    }
    #paper-nav-title {
      font-size: 0.82rem;
      color: #64748b;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      flex: 1;
      min-width: 0;
    }
    #paper-body {
      padding: 1.25rem 1rem calc(env(safe-area-inset-bottom) + 3rem);
      max-width: 720px;
      margin: 0 auto;
    }
    .pv-thumb {
      width: 100%;
      aspect-ratio: 16/9;
      object-fit: cover;
      border-radius: 0.85rem;
      background: #1e1e3a;
      display: block;
      margin-bottom: 1.1rem;
    }
    .pv-title {
      font-size: 1.15rem;
      font-weight: 700;
      color: #e2e8f0;
      line-height: 1.35;
      margin-bottom: 0.55rem;
    }
    .pv-authors {
      font-size: 0.82rem;
      color: #94a3b8;
      margin-bottom: 0.45rem;
      line-height: 1.4;
    }
    .pv-meta { display: flex; gap: 0.75rem; font-size: 0.78rem; color: #64748b; margin-bottom: 1.1rem; }
    .pv-abstract { font-size: 0.9rem; line-height: 1.7; color: #cbd5e1; margin-bottom: 1.35rem; }
    .pv-actions { display: flex; gap: 0.5rem; flex-wrap: wrap; margin-bottom: 2rem; }

    .related-heading {
      font-size: 0.72rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.07em;
      color: #475569;
      margin-bottom: 0.7rem;
    }
    #related-status { font-size: 0.82rem; color: #64748b; padding: 0.4rem 0 1rem; }
    #related-list { list-style: none; }
    .rel-card {
      display: grid;
      grid-template-columns: 72px 1fr;
      gap: 0.6rem;
      padding: 0.75rem;
      background: #1e1e3a;
      border: 1px solid #2d2d5e;
      border-radius: 0.75rem;
      margin-bottom: 0.6rem;
      cursor: pointer;
      transition: border-color 0.15s;
    }
    .rel-card:active { border-color: #7c3aed; }
    .rel-thumb {
      width: 72px;
      aspect-ratio: 4/3;
      object-fit: cover;
      border-radius: 0.4rem;
      background: #0f0f1a;
      display: grid;
      place-items: center;
      font-size: 1.2rem;
      color: #475569;
    }
    .rel-title { font-size: 0.85rem; font-weight: 600; color: #e2e8f0; line-height: 1.3; margin-bottom: 0.2rem; }
    .rel-authors { font-size: 0.72rem; color: #64748b; }

    /* Chat view */
    #chat-view {
      position: fixed;
      inset: 0;
      z-index: 25;
      background: #0f0f1a;
      display: flex;
      flex-direction: column;
      transform: translateX(100%);
      transition: transform 0.32s cubic-bezier(0.32, 0.72, 0, 1);
    }
    #chat-view.open { transform: translateX(0); }

    #chat-nav {
      flex-shrink: 0;
      display: flex;
      align-items: center;
      gap: 0.75rem;
      padding: calc(env(safe-area-inset-top) + 0.65rem) 1rem 0.65rem;
      background: rgba(15,15,26,0.95);
      border-bottom: 1px solid #1e1e3a;
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
    }
    #chat-back-btn {
      background: none; border: none; color: #a78bfa;
      font-size: 0.95rem; font-weight: 600; cursor: pointer;
      padding: 0.3rem 0; white-space: nowrap; flex-shrink: 0;
    }
    #chat-nav-title {
      font-size: 0.82rem; color: #64748b;
      overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
      flex: 1; min-width: 0;
    }
    #chat-messages {
      flex: 1;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
      padding: 1rem 1rem 0.5rem;
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
    }
    .chat-context {
      display: grid;
      grid-template-columns: 52px 1fr;
      gap: 0.6rem;
      background: #1e1e3a;
      border: 1px solid #2d2d5e;
      border-radius: 0.75rem;
      padding: 0.7rem;
    }
    .chat-context-thumb {
      width: 52px; aspect-ratio: 4/3; object-fit: cover;
      border-radius: 0.35rem; background: #0f0f1a; display: block;
    }
    .chat-context-fallback {
      width: 52px; aspect-ratio: 4/3; background: #0f0f1a;
      border-radius: 0.35rem; display: grid; place-items: center;
      font-size: 1.2rem;
    }
    .chat-context-title { font-size: 0.82rem; font-weight: 600; color: #e2e8f0; line-height: 1.3; }
    .chat-context-hint  { font-size: 0.72rem; color: #475569; margin-top: 0.2rem; }
    .msg { max-width: 86%; }
    .msg-user      { align-self: flex-end; }
    .msg-assistant { align-self: flex-start; }
    .msg-bubble {
      padding: 0.65rem 0.9rem;
      font-size: 0.9rem;
      line-height: 1.55;
      border-radius: 1.1rem;
    }
    .msg-user .msg-bubble {
      background: #7c3aed; color: #fff;
      border-bottom-right-radius: 0.3rem;
    }
    .msg-assistant .msg-bubble {
      background: #1e1e3a; color: #e2e8f0;
      border: 1px solid #2d2d5e;
      border-bottom-left-radius: 0.3rem;
    }

    #chat-input-bar {
      flex-shrink: 0;
      display: flex;
      gap: 0.5rem;
      align-items: flex-end;
      padding: 0.6rem 0.75rem calc(env(safe-area-inset-bottom) + 0.65rem);
      background: rgba(15,15,26,0.95);
      border-top: 1px solid #1e1e3a;
    }
    #chat-input {
      flex: 1;
      background: #1e1e3a;
      border: 1px solid #2d2d5e;
      border-radius: 1rem;
      padding: 0.65rem 0.85rem;
      color: #e2e8f0;
      font-size: 0.95rem;
      font-family: inherit;
      resize: none;
      max-height: 120px;
      line-height: 1.4;
      -webkit-appearance: none;
    }
    #chat-input:focus { outline: none; border-color: #7c3aed; }
    #chat-send-btn {
      width: 38px; height: 38px; flex-shrink: 0;
      background: #7c3aed; color: #fff;
      border: none; border-radius: 50%;
      font-size: 1.2rem; cursor: pointer;
      display: grid; place-items: center;
      transition: opacity 0.15s;
    }
    #chat-send-btn:disabled { background: #1e1e3a; color: #475569; cursor: default; }
    .btn-chat { background: #0d1b2a; color: #67e8f9; border: 1px solid #164e63; }

    #install-banner {
      display: none;
      background: #1e3a5f;
      border: 1px solid #2563eb;
      border-radius: 0.75rem;
      padding: 0.7rem 0.85rem;
      margin-bottom: 0.75rem;
      font-size: 0.8rem;
      color: #bfdbfe;
      align-items: center;
      gap: 0.6rem;
    }
    #install-banner.visible { display: flex; }
    #install-banner .banner-text { flex: 1; }
    #install-btn {
      padding: 0.4rem 0.75rem;
      background: #2563eb;
      color: #fff;
      border: none;
      border-radius: 0.4rem;
      font-size: 0.78rem;
      font-weight: 600;
      cursor: pointer;
    }

    /* Share-target bottom sheet */
    #share-modal {
      position: fixed;
      inset: 0;
      z-index: 30;
      visibility: hidden;
      pointer-events: none;
    }
    #share-modal.open {
      visibility: visible;
      pointer-events: auto;
    }
    #share-backdrop {
      position: absolute;
      inset: 0;
      background: rgba(0, 0, 0, 0.65);
      opacity: 0;
      transition: opacity 0.25s ease;
    }
    #share-modal.open #share-backdrop { opacity: 1; }
    #share-sheet {
      position: absolute;
      bottom: 0; left: 0; right: 0;
      background: #131325;
      border-radius: 1.25rem 1.25rem 0 0;
      border-top: 1px solid #2d2d5e;
      padding: 1rem 1rem calc(env(safe-area-inset-bottom) + 1.25rem);
      max-height: 82vh;
      overflow-y: auto;
      transform: translateY(100%);
      transition: transform 0.3s cubic-bezier(0.32, 0.72, 0, 1);
    }
    #share-modal.open #share-sheet { transform: translateY(0); }
    .share-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 0.9rem;
    }
    .share-label {
      font-size: 0.75rem;
      font-weight: 700;
      color: #a78bfa;
      text-transform: uppercase;
      letter-spacing: 0.07em;
    }
    #share-close {
      background: none;
      border: none;
      color: #64748b;
      font-size: 1.4rem;
      cursor: pointer;
      line-height: 1;
      padding: 0.15rem 0.3rem;
    }
  </style>
</head>
<body>

<header>
  <h1>HF Daily Papers</h1>
  <div id="meta">Loading…</div>
  <input id="search" type="search" placeholder="Search title, author, abstract…" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" />
  <div class="controls">
    <select id="date" aria-label="Date"></select>
    <select id="sort" aria-label="Sort">
      <option value="top">Top</option>
      <option value="new">Newest</option>
    </select>
    <button id="refresh" type="button" aria-label="Refresh">↻</button>
  </div>
</header>

<main>
  <div id="install-banner">
    <span>📲</span>
    <span class="banner-text">Add to Home Screen for the full app experience.</span>
    <button id="install-btn" type="button">Install</button>
  </div>
  <div id="status">Loading papers…</div>
  <ul id="list"></ul>
</main>

<div id="chat-view">
  <div id="chat-nav">
    <button id="chat-back-btn" type="button">← Back</button>
    <div id="chat-nav-title"></div>
  </div>
  <div id="chat-messages"></div>
  <div id="chat-input-bar">
    <textarea id="chat-input" placeholder="Ask about this paper…" rows="1"></textarea>
    <button id="chat-send-btn" type="button" disabled aria-label="Send">↑</button>
  </div>
</div>

<div id="paper-view">
  <div id="paper-nav">
    <button id="paper-back" type="button">← Back</button>
    <div id="paper-nav-title"></div>
  </div>
  <div id="paper-body"></div>
</div>

<div id="share-modal">
  <div id="share-backdrop"></div>
  <div id="share-sheet">
    <div class="share-header">
      <span class="share-label">Shared Paper</span>
      <button id="share-close" type="button" aria-label="Close">✕</button>
    </div>
    <div id="share-content"></div>
  </div>
</div>

<div id="toast" role="status" aria-live="polite"></div>

<script>
(() => {
  const PROXY = "https://corsproxy.io/?url=";
  const API = (date) => `https://huggingface.co/api/daily_papers?date=${date}&limit=50`;

  const $ = (id) => document.getElementById(id);
  const listEl = $("list");
  const statusEl = $("status");
  const metaEl = $("meta");
  const searchEl = $("search");
  const dateEl = $("date");
  const sortEl = $("sort");
  const refreshEl = $("refresh");
  const toastEl = $("toast");

  const state = {
    papers: [],
    date: todayUTC(),
    query: "",
    sort: localStorage.getItem("papers:sort") || "top",
    fetchedAt: null,
    pendingOpen: null,
  };

  function todayUTC() {
    return new Date().toISOString().slice(0, 10);
  }

  function offsetDate(days) {
    const d = new Date();
    d.setUTCDate(d.getUTCDate() - days);
    return d.toISOString().slice(0, 10);
  }

  function populateDateSelect() {
    const frag = document.createDocumentFragment();

    const addOpt = (value, label, disabled = false) => {
      const opt = document.createElement("option");
      opt.value = value;
      opt.textContent = label;
      if (disabled) opt.disabled = true;
      frag.appendChild(opt);
    };

    // Aggregate views first
    addOpt("all-7",  "All – 7 days");
    addOpt("all-30", "All – 30 days");
    addOpt("",       "──────────", true);

    // Individual days
    for (let i = 0; i < 7; i++) {
      const d = offsetDate(i);
      addOpt(d, i === 0 ? `Today (${shortDate(d)})` : i === 1 ? `Yesterday (${shortDate(d)})` : shortDate(d));
    }

    dateEl.appendChild(frag);

    const saved = localStorage.getItem("papers:date");
    if (saved && [...dateEl.options].some(o => o.value === saved && !o.disabled)) {
      dateEl.value = saved;
      state.date = saved;
    } else {
      dateEl.value = state.date; // today
    }
    sortEl.value = state.sort;
  }

  function shortDate(iso) {
    const d = new Date(iso + "T00:00:00Z");
    return d.toLocaleDateString(undefined, { month: "short", day: "numeric", timeZone: "UTC" });
  }

  function relativeTime(ts) {
    if (!ts) return "";
    const s = Math.floor((Date.now() - ts) / 1000);
    if (s < 60) return "just now";
    if (s < 3600) return `${Math.floor(s / 60)}m ago`;
    if (s < 86400) return `${Math.floor(s / 3600)}h ago`;
    return `${Math.floor(s / 86400)}d ago`;
  }

  function escapeHtml(s) {
    return String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  }

  function normalize(arr) {
    if (!Array.isArray(arr)) return [];
    return arr.map(entry => {
      const p = entry.paper || {};
      const id = p.id || entry.id || "";
      const authors = Array.isArray(p.authors)
        ? p.authors.map(a => (typeof a === "string" ? a : a.name)).filter(Boolean)
        : [];
      return {
        id,
        title: (entry.title || p.title || "").trim(),
        summary: (p.summary || entry.summary || "").trim().replace(/\s+/g, " "),
        authors,
        publishedAt: p.publishedAt || entry.publishedAt || "",
        upvotes: p.upvotes ?? entry.upvotes ?? 0,
        thumbnail: entry.thumbnail || p.thumbnail || (entry.media && entry.media.thumbnail) || "",
      };
    }).filter(p => p.id && p.title);
  }

  async function fetchPapers(date) {
    refreshEl.classList.add("spinning");
    try {
      if (date === "all-7" || date === "all-30") {
        await fetchMultipleDays(date === "all-7" ? 7 : 30);
        return;
      }

      const cacheKey = `papers:${date}`;
      const cached = readCache(cacheKey);
      if (cached) {
        state.papers = cached.papers;
        state.fetchedAt = cached.fetchedAt;
        render();
      } else {
        state.papers = [];
        statusEl.textContent = "Loading papers…";
        listEl.innerHTML = "";
      }

      try {
        const fresh = await fetchOnce(date);
        state.papers = fresh;
        state.fetchedAt = Date.now();
        writeCache(cacheKey, { papers: fresh, fetchedAt: state.fetchedAt });
        updateBadge(fresh);
        render();
      } catch (err) {
        console.warn("fetch failed:", err);
        if (cached) {
          showToast("Couldn't refresh — showing cached");
        } else {
          statusEl.innerHTML = `Couldn't load papers.<br><button class="retry" type="button" onclick="location.reload()">Retry</button>`;
        }
      }
    } finally {
      refreshEl.classList.remove("spinning");
    }
  }

  async function fetchMultipleDays(n) {
    const dates = Array.from({ length: n }, (_, i) => offsetDate(i));

    // Render from cache immediately if anything is available
    const initial = mergeFromCache(dates);
    if (initial.length) {
      state.papers = initial;
      state.fetchedAt = Date.now();
      render();
    } else {
      state.papers = [];
      statusEl.style.display = "block";
      statusEl.textContent = `Loading ${n} days of papers…`;
      listEl.innerHTML = "";
    }

    // Fetch uncached days in parallel batches of 5
    const uncached = dates.filter(d => !readCache(`papers:${d}`));
    for (let i = 0; i < uncached.length; i += 5) {
      await Promise.allSettled(
        uncached.slice(i, i + 5).map(async (d) => {
          try {
            const papers = await fetchOnce(d);
            writeCache(`papers:${d}`, { papers, fetchedAt: Date.now() });
          } catch {}
        })
      );
      state.papers = mergeFromCache(dates);
      state.fetchedAt = Date.now();
      render();
    }
  }

  function mergeFromCache(dates) {
    const seen = new Set();
    const out = [];
    for (const date of dates) {
      const c = readCache(`papers:${date}`);
      if (!c) continue;
      for (const p of c.papers) {
        if (!seen.has(p.id)) { seen.add(p.id); out.push(p); }
      }
    }
    return out;
  }

  async function fetchOnce(date) {
    const url = API(date);
    try {
      const r = await fetch(url, { mode: "cors" });
      if (!r.ok) throw new Error("direct " + r.status);
      return normalize(await r.json());
    } catch (e) {
      const r = await fetch(PROXY + encodeURIComponent(url));
      if (!r.ok) throw new Error("proxy " + r.status);
      return normalize(await r.json());
    }
  }

  function readCache(key) {
    try {
      const raw = localStorage.getItem(key);
      if (!raw) return null;
      const obj = JSON.parse(raw);
      if (!obj || !Array.isArray(obj.papers)) return null;
      return obj;
    } catch { return null; }
  }

  function writeCache(key, obj) {
    try { localStorage.setItem(key, JSON.stringify(obj)); } catch {}
  }

  function applyFilters() {
    const q = state.query.trim().toLowerCase();
    let list = state.papers;
    if (q) {
      list = list.filter(p => {
        const hay = (p.title + " " + p.summary + " " + p.authors.join(" ")).toLowerCase();
        return hay.includes(q);
      });
    }
    list = list.slice().sort((a, b) => {
      if (state.sort === "new") {
        return (b.publishedAt || "").localeCompare(a.publishedAt || "");
      }
      return (b.upvotes || 0) - (a.upvotes || 0);
    });
    return list;
  }

  function render() {
    const filtered = applyFilters();
    const total = state.papers.length;
    const dateLabel = state.date === "all-7"  ? "Last 7 days" :
                      state.date === "all-30" ? "Last 30 days" :
                      shortDate(state.date);
    metaEl.textContent = total
      ? `${dateLabel} · ${filtered.length}${filtered.length !== total ? "/" + total : ""} papers · refreshed ${relativeTime(state.fetchedAt)}`
      : dateLabel;

    if (!total) {
      statusEl.style.display = "block";
      statusEl.textContent = state.fetchedAt ? "No papers found." : "Loading papers…";
      listEl.innerHTML = "";
      return;
    }
    if (!filtered.length) {
      statusEl.style.display = "block";
      statusEl.textContent = "No papers match your search.";
      listEl.innerHTML = "";
      return;
    }
    statusEl.style.display = "none";

    if (state.pendingOpen) {
      const pid = state.pendingOpen;
      const pp = state.papers.find(p => p.id === pid);
      if (pp) { state.pendingOpen = null; requestAnimationFrame(() => openPaper(pp)); }
    }

    listEl.innerHTML = filtered.map(p => {
      const authors = p.authors.length
        ? (p.authors.slice(0, 3).join(", ") + (p.authors.length > 3 ? `, +${p.authors.length - 3}` : ""))
        : "";
      const date = p.publishedAt ? shortDate(p.publishedAt.slice(0, 10)) : "";
      const thumb = p.thumbnail
        ? `<img class="thumb" loading="lazy" src="${escapeHtml(p.thumbnail)}" alt="" />`
        : `<div class="thumb no-img">📄</div>`;
      return `
        <li class="paper" data-id="${escapeHtml(p.id)}">
          ${thumb}
          <div class="info">
            <div class="title">${escapeHtml(p.title)}</div>
            ${authors ? `<div class="authors">${escapeHtml(authors)}</div>` : ""}
            <div class="row">
              <span class="upvotes">▲ ${p.upvotes}</span>
              ${date ? `<span class="date">${escapeHtml(date)}</span>` : ""}
            </div>
            <p class="abstract clamped">${escapeHtml(p.summary || "No abstract available.")}</p>
          </div>
        </li>`;
    }).join("");
  }

  // --- Deep Links & Paper Sharing ---
  function sharePaper(id) {
    const date = findPaperDate(id);
    const url = `${location.origin}${location.pathname}?paper=${encodeURIComponent(id)}&date=${encodeURIComponent(date)}`;
    const paper = state.papers.find(p => p.id === id);
    const title = paper ? paper.title : "Paper";
    if (navigator.share) {
      navigator.share({ title, url }).catch(err => {
        if (err.name !== "AbortError") copyToClipboard(url);
      });
    } else {
      copyToClipboard(url);
    }
  }

  function findPaperDate(id) {
    for (let i = 0; i < 30; i++) {
      const d = offsetDate(i);
      const c = readCache(`papers:${d}`);
      if (c && c.papers.some(p => p.id === id)) return d;
    }
    return state.date.startsWith("all") ? todayUTC() : state.date;
  }

  async function copyToClipboard(text) {
    try {
      await navigator.clipboard.writeText(text);

  async function loadRelated(paper) {
    if (paper.id !== currentPaper?.id) return;
    const statusEl = $("related-status");
    const relListEl = $("related-list");
    let related = [];

    // Try Semantic Scholar recommendations
    try {
      const ssUrl = `https://api.semanticscholar.org/recommendations/v1/papers/forpaper/ArXiv:${paper.id}?limit=8&fields=title,authors,year,externalIds`;
      let r;
      try { r = await fetch(ssUrl); if (!r.ok) throw 0; }
      catch { r = await fetch(PROXY + encodeURIComponent(ssUrl)); }
      const data = await r.json();
      related = (data.recommendedPapers || [])
        .filter(p => p.externalIds?.ArXiv)
        .slice(0, 5)
        .map(p => {
          const id = p.externalIds.ArXiv;
          const cached = findPaperInCache(id);
          return cached || {
            id, title: p.title,
            authors: (p.authors || []).map(a => a.name),
            publishedAt: p.year ? `${p.year}-01-01` : "",
            upvotes: 0, summary: "", thumbnail: "",
          };
        });
    } catch {}

    // Fall back to local keyword match
    if (!related.length) related = findRelatedLocal(paper);

    if (paper.id !== currentPaper?.id) return;

    if (!related.length) {
      statusEl.textContent = "No related papers found.";
      return;
    }
    statusEl.style.display = "none";

    relListEl.innerHTML = related.map(p => {
      const aut = p.authors.slice(0, 2).join(", ") + (p.authors.length > 2 ? `, +${p.authors.length - 2}` : "");
      const thumbHtml = p.thumbnail
        ? `<img class="rel-thumb" loading="lazy" src="${escapeHtml(p.thumbnail)}" alt="" />`
        : `<div class="rel-thumb">📄</div>`;
      return `<li class="rel-card" data-id="${escapeHtml(p.id)}">
        ${thumbHtml}
        <div>
          <div class="rel-title">${escapeHtml(p.title)}</div>
          ${aut ? `<div class="rel-authors">${escapeHtml(aut)}</div>` : ""}
        </div>
      </li>`;
    }).join("");

    relListEl.addEventListener("click", e => {
      const card = e.target.closest(".rel-card");
      if (!card) return;
      const rel = related.find(p => p.id === card.dataset.id);
      if (rel) openPaper(rel);
    }, { once: true });
  }

  function findPaperInCache(id) {
    for (let i = 0; i < 30; i++) {
      const c = readCache(`papers:${offsetDate(i)}`);
      if (!c) continue;
      const p = c.papers.find(p => p.id === id);
      if (p) return p;
    }
    return null;
  }

  function findRelatedLocal(paper) {
    const stop = new Set(["a","an","the","of","in","on","for","to","with","and","or","is","are","as","by","via","from","using","based","approach","model","learning","deep","neural","network","towards","new"]);
    const words = new Set(paper.title.toLowerCase().split(/\W+/).filter(w => w.length > 3 && !stop.has(w)));
    const all = [];
    for (let i = 0; i < 30; i++) {
      const c = readCache(`papers:${offsetDate(i)}`);
      if (c) all.push(...c.papers);
    }
    return all
      .filter(p => p.id !== paper.id)
      .map(p => ({ p, score: p.title.toLowerCase().split(/\W+/).filter(w => words.has(w)).length }))
      .filter(x => x.score > 0)
      .sort((a, b) => b.score - a.score)
      .slice(0, 5)
      .map(x => x.p);
  }

      ? `<img class="chat-context-thumb" src="${escapeHtml(paper.thumbnail)}" alt="" />`

        </div>

  function addBubble(role, text) {
    const id = `cm-${++chatMsgIdx}`;
    const el = document.createElement("div");
    el.className = `msg msg-${role}`;
    el.id = id;
    el.innerHTML = `<div class="msg-bubble">${renderMd(text)}</div>`;
    chatMessagesEl.appendChild(el);
    chatMessagesEl.scrollTop = chatMessagesEl.scrollHeight;
    return id;
  }

  function updateBubble(id, text) {
    const el = document.getElementById(id);
    if (!el) return;
    el.querySelector(".msg-bubble").innerHTML = renderMd(text);
    chatMessagesEl.scrollTop = chatMessagesEl.scrollHeight;
  }

  function renderMd(text) {
    return escapeHtml(text)
      .replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>")
      .replace(/`([^`]+)`/g, "<code style='background:#0f172a;padding:.1em .35em;border-radius:.3em;font-size:.88em'>$1</code>")
      .replace(/\n/g, "<br>");
  }

  const CHAT_API_KEY = "__ANTHROPIC_KEY__";

  async function sendChat(text) {
    if (!text.trim() || !chatPaper) return;

    chatHistory.push({ role: "user", content: text });
    addBubble("user", text);
    chatInputEl.value = "";
    chatInputEl.style.height = "";
    chatSendBtn.disabled = true;

    const system = [
      "You are a helpful AI research assistant discussing an academic paper.",
      "",
      `Title: ${chatPaper.title}`,
      `Authors: ${chatPaper.authors.join(", ")}`,
      `Abstract: ${chatPaper.summary || "Not available."}`,
      "",
      "Answer questions about this paper clearly and concisely. Explain technical terms, discuss methodology, compare with related work, and highlight key contributions. If asked something beyond the abstract, be honest about the limits of your knowledge.",
    ].join("\n");

    const loadId = addBubble("assistant", "…");

    try {
      const res = await fetch("https://api.anthropic.com/v1/messages", {
        method: "POST",
        headers: {
          "x-api-key": CHAT_API_KEY,
          "anthropic-version": "2023-06-01",
          "content-type": "application/json",
          "anthropic-dangerous-allow-browser": "true",
        },
        body: JSON.stringify({
          model: "claude-haiku-4-5-20251001",
          max_tokens: 1024,
          system,
          messages: chatHistory,
          stream: true,
        }),
      });

      if (!res.ok) {
        const err = await res.json().catch(() => ({}));
        throw new Error(err.error?.message || `HTTP ${res.status}`);
      }

      const reader  = res.body.getReader();
      const decoder = new TextDecoder();
      let full = "";

      outer: while (true) {
        const { done, value } = await reader.read();
        if (done) break;
        for (const line of decoder.decode(value, { stream: true }).split("\n")) {
          if (!line.startsWith("data: ")) continue;
          const raw = line.slice(6).trim();
          if (raw === "[DONE]") break outer;
          try {
            const evt = JSON.parse(raw);
            if (evt.type === "content_block_delta" && evt.delta?.text) {
              full += evt.delta.text;
              updateBubble(loadId, full);
            }
          } catch {}
        }
      }

      if (full) chatHistory.push({ role: "assistant", content: full });

    } catch (err) {
      updateBubble(loadId, "Error: " + err.message);
    }
  }

  $("chat-back-btn").addEventListener("click", () => history.back());

  // --- Share Target ---
  async function handleShareTarget() {
    const params = new URLSearchParams(location.search);
    const raw = params.get("url") || params.get("text") || "";
    if (!raw) return;

    // Remove share params so a refresh doesn't re-trigger
    history.replaceState(null, "", location.pathname);

    // Extract arxiv ID from common URL patterns
    const match = raw.match(/(?:arxiv\.org\/(?:abs|pdf)\/|huggingface\.co\/papers\/)(\d{4}\.\d+)/i);
    if (!match) return;
    const id = match[1];

    // Fast path: search all cached days
    let paper = null;
    for (let i = 0; i < 30; i++) {
      const c = readCache(`papers:${offsetDate(i)}`);
      if (!c) continue;
      paper = c.papers.find(p => p.id === id || p.id.startsWith(id + "v"));
      if (paper) break;
    }

    // Fallback: fetch from HF single-paper API
    if (!paper) {
      try {
        const url = `https://huggingface.co/api/papers/${id}`;
        let r;
        try { r = await fetch(url, { mode: "cors" }); if (!r.ok) throw 0; }
        catch { r = await fetch(PROXY + encodeURIComponent(url)); }
        if (r && r.ok) {
          const data = await r.json();
          paper = normalize([{ paper: data, title: data.title, thumbnail: data.thumbnail }])[0];
        }
      } catch {}
    }

    // Last resort: minimal stub so the sheet still opens with action buttons
    if (!paper) paper = { id, title: id, summary: "", authors: [], upvotes: 0, thumbnail: "" };

    showSharedPaper(paper);
  }

  function showSharedPaper(p) {

    $("share-content").innerHTML = `

        ${thumb}
        <div class="info">
          <div class="title">${escapeHtml(p.title)}</div>

  if (dlPaper) {
    history.replaceState(null, "", location.pathname);
    if (dlDate && /^\d{4}-\d{2}-\d{2}$/.test(dlDate)) {
      state.date = dlDate;
      if ([...dateEl.options].some(o => o.value === dlDate)) dateEl.value = dlDate;
    }
    state.pendingOpen = dlPaper;
  }

  fetchPapers(state.date);

  // Visibility: save seen count when leaving, clear badge + maybe refresh when returning
  document.addEventListener("visibilitychange", () => {
    if (document.visibilityState === "hidden" && state.date === todayUTC() && state.papers.length) {
      localStorage.setItem(`badge:seen:${todayUTC()}`, state.papers.length);
    }
    if (document.visibilityState === "visible") {
      navigator.clearAppBadge?.().catch(() => {});
      if (state.fetchedAt && Date.now() - state.fetchedAt > 5 * 60 * 1000) {
        fetchPapers(state.date);
      }
    }
  });
})();
</script>
</body>
</html>
